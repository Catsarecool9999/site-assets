    <style>

<body>

    <div class="container">
        <h2>🤖 Open-Source P2P Signal Tunnel <span class="status-badge" id="netStatus">Standby</span></h2>
        
        <div class="setup-bar">
            <div class="btn-row">
                <button class="action-btn host-btn" onclick="startBroadcaster()">Step 1: Broadcast My Laptop</button>
                <button class="action-btn client-btn" onclick="startReceiver()">[Chromebook] Step 2: Receive Feed</button>
                <button class="action-btn lock-btn" onclick="lockHandshakeTunnel()">Step 4: Lock Connection</button>
            </div>
            <textarea id="cryptoTokenArea" placeholder="Handshake session tokens will process here..."></textarea>
        </div>

        <div class="main-layout">
            <div class="viewport" id="videoViewport">
                <div class="placeholder-text" id="videoPlaceholder">Awaiting cryptographic handshake configurations...</div>
                <video id="liveScreenStream" autoplay playsinline style="display:none;"></video>
            </div>
            
            <div class="terminal-side">
                <div style="margin-bottom: 8px; font-weight: bold; color: #fff;">🛰️ Core Engine Log:</div>
                <div class="log-feed" id="terminalLog">> Decryption verified. Ready...</div>
            </div>
        </div>
    </div>

<script>
var p2pInstance = null;
var hardwareStream = null;
var dataChannelBroker = null;

function appendTerminal(text) {
    var log = document.getElementById('terminalLog');
    log.innerHTML += "<br>> " + text;
    log.scrollTop = log.scrollHeight;
}

// Employs Google's verified, unblockable public infrastructure routes
var openRtcConfig = { iceServers: [{ urls: "stun:://google.com" }, { urls: "stun:://google.com" }] };

// --- STEP 1: RUN AT HOME ---
async function startBroadcaster() {
    appendTerminal("Sourcing local hardware display layers...");
    try {
        hardwareStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
        document.getElementById('videoPlaceholder').style.display = 'none';
        var video = document.getElementById('liveScreenStream');
        video.style.display = 'block';
        video.srcObject = hardwareStream;

        p2pInstance = new RTCPeerConnection(openRtcConfig);
        dataChannelBroker = p2pInstance.createDataChannel("pipeline");

        hardwareStream.getTracks().forEach(track => p2pInstance.addTrack(track, hardwareStream));

        p2pInstance.onicecandidate = e => {
            if (!e.candidate) {
                // Compiles connection vectors into an absolute error-free base64 encryption ticket string
                document.getElementById('cryptoTokenArea').value = btoa(JSON.stringify(p2pInstance.localDescription));
                appendTerminal("✨ STEP 1 COMPLETE! Copy the text string above and save it inside a text document on your USB drive or draft email.");
            }
        };

        var offer = await p2pInstance.createOffer();
        await p2pInstance.setLocalDescription(offer);
    } catch(err) { appendTerminal("❌ Error: Screen share execution canceled."); }
}

// --- STEP 2: RUN AT SCHOOL ---
async function startReceiver() {
    var rawTextToken = document.getElementById('cryptoTokenArea').value.trim();
    if (rawTextToken === "") { appendTerminal("⚠️ Error: Paste the laptop's text token chunk into the box first!"); return; }

    p2pInstance = new RTCPeerConnection(openRtcConfig);
    
    p2pInstance.ontrack = e => {
        appendTerminal("🟢 Secure stream track intercepted! Syncing media frames...");
        document.getElementById('videoPlaceholder').style.display = 'none';
        var video = document.getElementById('liveScreenStream');
        video.style.display = 'block';
        video.srcObject = e.streams[0];
    };

    p2pInstance.onicecandidate = e => {
        if (!e.candidate) {
            document.getElementById('cryptoTokenArea').value = btoa(JSON.stringify(p2pInstance.localDescription));
            appendTerminal("📋 Step 3 Complete! Copy this response text back to your text file, paste it on your laptop, and click Step 4.");
        }
    };

    await p2pInstance.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(rawTextToken))));
    var answer = await p2pInstance.createAnswer();
    await p2pInstance.setLocalDescription(answer);
}

// --- STEP 4: RUN AT HOME ---
async function lockHandshakeTunnel() {
    var rawAnswerToken = document.getElementById('cryptoTokenArea').value.trim();
    if (rawAnswerToken === "") return;
    await p2pInstance.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(rawAnswerToken))));
    appendTerminal("🔒 Handshake locked! 30FPS encrypted connection stable.");
    document.getElementById('netStatus').innerText = "LIVE";
