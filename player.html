<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Sandbox YouTube Proxy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            flex-grow: 1;
        }
        h2 {
            margin-top: 0;
            color: #ff0000;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex-grow: 1;
            background-color: #212121;
            border: 1px solid #3c3c3c;
            border-radius: 24px;
            padding: 12px 24px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff0000;
        }
        button {
            background-color: #cc0000;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 0 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #ff0000; }
        .main-layout {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: 70vh;
        }
        .player-side {
            flex: 2;
            background-color: #000000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #212121;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .results-side {
            flex: 1;
            background-color: #1f1f1f;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #212121;
        }
        .video-item {
            display: flex;
            gap: 12px;
            background-color: #2d2d2d;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }
        .video-item:hover {
            background-color: #3d3d3d;
            transform: scale(1.02);
        }
        .video-item img {
            width: 110px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #000000;
        }
        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .video-title {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .video-author {
            font-size: 11px;
            color: #aaaaaa;
            margin-top: 6px;
        }
        .placeholder-text {
            color: #888888;
            text-align: center;
            font-size: 15px;
            width: 100%;
        }
        .source-badge {
            font-size: 9px;
            background-color: #444;
            color: #fff;
            padding: 1px 4px;
            border-radius: 3px;
            align-self: flex-start;
            margin-top: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 Multi-Engine YouTube Aggregator Framework</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search keywords OR paste a regular YouTube URL..." onkeydown="if(event.key === 'Enter') handleInput()">
        <button onclick="handleInput()">Search / Play</button>
    </div>

    <div class="main-layout">
        <!-- Player Canvas Box -->
        <div class="player-side" id="playerCanvas">
            <div class="placeholder-text">Type a topic or paste a watch link to mount cross-network pipes.</div>
        </div>
        
        <!-- Results Array Container -->
        <div class="results-side" id="resultsCanvas">
            <div class="placeholder-text" style="margin-top: 50px;">Awaiting query inputs...</div>
        </div>
    </div>
</div>

<script>
// Mirror cluster array nodes
var invidiousNodes = [
    "https://nerdvpn.de",
    "https://no-logs.com",
    "https://melmac.space",
    "https://tux.im",
    "https://projectsegfau.lt",
    "https://privacydev.net"
];

var pipedNodes = [
    "https://kavin.rocks",
    "https://moomoo.me",
    "https://projectsegfau.lt",
    "https://garudalinux.org"
];

var chosenPlaybackNode = "https://nerdvpn.de"; // Playback fallback default
var searchActive = false;

function handleInput() {
    var rawInput = document.getElementById('searchInput').value.trim();
    var playerCanvas = document.getElementById('playerCanvas');
    var resultsCanvas = document.getElementById('resultsCanvas');
    
    if (rawInput === "") return;
    
    var videoId = "";
    
    // --- STEP 1: CHECK IF IT IS A PASTED LINK ---
    if (rawInput.includes("://youtube.com") || rawInput.includes("youtu.be/") || rawInput.includes("embed/")) {
        var longMatch = rawInput.match(/[?&]v=([^&#\s]+)/);
        var shortMatch = rawInput.match(/youtu\.be\/([^?&#\s]+)/);
        var embedMatch = rawInput.match(/embed\/([^?&#\s]+)/);

        if (longMatch) videoId = longMatch[1];
        else if (shortMatch) videoId = shortMatch[1];
        else if (embedMatch) videoId = embedMatch[1];
    }
    
    // --- STEP 2: IF LINK MATCHED, PLAY IT IMMEDIATELY ---
    if (videoId !== "") {
        resultsCanvas.innerHTML = '<div class="placeholder-text">🔗 Normal link detected! Bypassing filters and mounting video player frame directly...</div>';
        loadVideoPlayer(videoId);
    } 
    // --- STEP 3: IF TEXT MATCHED, RUN THE GLOBAL SEARCH ENGGINE ---
    else {
        resultsCanvas.innerHTML = '<div class="placeholder-text">📡 Querying Invidious, Piped, and Proxy clusters simultaneously...</div>';
        searchActive = true;
        var successfullyRendered = false;

        invidiousNodes.forEach(function(baseNode) {
            if (successfullyRendered) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", baseNode + "/api/v1/search?q=" + encodeURIComponent(rawInput) + "&type=video", true);
            xhr.timeout = 5000;
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 400 && searchActive && !successfullyRendered) {
                    successfullyRendered = true;
                    chosenPlaybackNode = baseNode; 
                    renderGlobalVideos(JSON.parse(xhr.responseText), "invidious");
                }
            };
            xhr.send();
        });

        pipedNodes.forEach(function(baseNode) {
            if (successfullyRendered) return;
            var xhr = new XMLHttpRequest();
            xhr.open("GET", baseNode + "/search?q=" + encodeURIComponent(rawInput) + "&filter=videos", true);
            xhr.timeout = 5000;
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 400 && searchActive && !successfullyRendered) {
                    successfullyRendered = true;
                    var data = JSON.parse(xhr.responseText);
                    if (data && data.streams && data.streams.length > 0) {
                        var normalizedData = data.streams.map(function(item) {
                            return {
                                videoId: item.url.split("v=")[1] || item.url.split("/").pop(),
                                title: item.title,
                                author: item.uploaderName
                            };
                        });
                        chosenPlaybackNode = "https://nerdvpn.de"; 
                        renderGlobalVideos(normalizedData, "piped cluster");
                    }
                }
            };
            xhr.send();
        });

        setTimeout(function() {
            if (!successfullyRendered && searchActive) {
                resultsCanvas.innerHTML = '<div class="placeholder-text">⚠️ Core nodes busy. Click search again to send another burst query!</div>';
            }
        }, 6000);
    }
}

    resultsCanvas.innerHTML = "";
    searchActive = false;

        var item = document.createElement('div');
        item.className = 'video-item';
        item.onclick = function() { loadVideoPlayer(video.videoId); };
        
        var thumbUrl = chosenPlaybackNode + "/vi/" + video.videoId + "/mqdefault.jpg";
