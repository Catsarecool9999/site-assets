<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Local YouTube Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #eeeeee;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            flex-grow: 1;
        }
        h2 {
            margin-top: 0;
            color: #ff0000;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex-grow: 1;
            background-color: #2d2d2d;
            border: 1px solid #444444;
            border-radius: 20px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #cc0000;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: 60vh;
        }
        .player-side {
            flex: 2;
            background-color: #000000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .results-side {
            flex: 1;
            background-color: #252525;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .video-item {
            display: flex;
            gap: 10px;
            background-color: #333333;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        .video-item:hover {
            background-color: #444444;
        }
        .video-item img {
            width: 90px;
            height: 68px;
            object-fit: cover;
            border-radius: 4px;
        }
        .video-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .video-title {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-author {
            font-size: 11px;
            color: #aaaaaa;
            margin-top: 4px;
        }
        .placeholder-text {
            color: #888888;
            text-align: center;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📺 Local YouTube Search Hub</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for real YouTube videos here..." onkeydown="if(event.key === 'Enter') executeSearch()">
        <button onclick="executeSearch()">Search</button>
    </div>

    <div class="main-layout">
        <!-- Live Video Screen -->
        <div class="player-side" id="playerCanvas">
            <div class="placeholder-text" id="playerPlaceholder">Select a video from the search results to start playing.</div>
        </div>
        
        <!-- Interactive Search Results Grid -->
        <div class="results-side" id="resultsCanvas">
            <div class="placeholder-text" style="margin-top: 50px;">Your search results will appear here.</div>
        </div>
    </div>
</div>

<script>
function executeSearch() {
    var query = document.getElementById('searchInput').value.trim();
    var resultsCanvas = document.getElementById('resultsCanvas');
    
    if (query === "") return;
    
    resultsCanvas.innerHTML = '<div class="placeholder-text">Searching YouTube database...</div>';
    
    // Connects directly to an open API node to safely fetch video data without triggering school filters
    var apiSearchUrl = "https://nerdvpn.de" + encodeURIComponent(query) + "&type=video";
    
    fetch(apiSearchUrl)
        .then(response => response.json())
        .then(data => {
            resultsCanvas.innerHTML = "";
            if (data && data.length > 0) {
                data.forEach(video => {
                    var item = document.createElement('div');
                    item.className = 'video-item';
                    item.onclick = function() { loadVideoPlayer(video.videoId); };
                    
                    item.innerHTML = `
                        <img src="https://nerdvpn.de{video.videoId}/mqdefault.jpg" alt="thumbnail">
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-author">${video.author}</div>
                        </div>
                    `;
                    resultsCanvas.appendChild(item);
                });
            } else {
                resultsCanvas.innerHTML = '<div class="placeholder-text">❌ No videos found. Try different keywords.</div>';
            }
        })
        .catch(err => {
            resultsCanvas.innerHTML = '<div class="placeholder-text">❌ Connection busy. Please try your search again.</div>';
        });
}

function loadVideoPlayer(id) {
    var playerCanvas = document.getElementById('playerCanvas');
    // Loads the live video stream from an unblocked server frame layer
    playerCanvas.innerHTML = '<iframe src="https://nerdvpn.de' + id + '" allowfullscreen></iframe>';
}
</script>

</body>
</html>
