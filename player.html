<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Media Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1f22;
            color: #dbdee1;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            flex-grow: 1;
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex-grow: 1;
            background-color: #313338;
            border: 1px solid #111214;
            border-radius: 4px;
            padding: 10px;
            color: #f2f3f5;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #5865f2;
        }
        button {
            background-color: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .player-frame {
            flex-grow: 1;
            background-color: #2b2d31;
            border: 1px solid #111214;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 350px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .placeholder {
            text-align: center;
            color: #949ba4;
            padding: 20px;
        }
        .status-tag {
            font-size: 12px;
            background-color: #23a55a;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 Offline Sandbox Player <span class="status-tag">LOCAL RUNTIME</span></h2>
    
    <div class="search-box">
        <input type="text" id="queryInput" placeholder="Paste your standard YouTube link here..." onkeydown="if(event.key === 'Enter') processSearch()">
        <button onclick="processSearch()">Extract & Play</button>
    </div>

    <div class="player-frame" id="displayCanvas">
        <div class="placeholder">
            <p style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">No Video Loaded</p>
            <p style="margin: 0; font-size: 14px;">Paste any normal YouTube video address above. The local code will reconstruct it safely.</p>
        </div>
    </div>
</div>

<script>
function processSearch() {
    var rawInput = document.getElementById('queryInput').value.trim();
    var canvas = document.getElementById('displayCanvas');
    
    if (rawInput === "") return;
    
    var videoId = "";
    
    // Pure text character matching that avoids array structure typos completely
    if (rawInput.includes("v=")) {
        var marker = rawInput.split("v=")[1];
        if (marker.includes("&")) {
            videoId = marker.split("&")[0];
        } else {
            videoId = marker;
        }
    } else if (rawInput.includes("youtu.be/")) {
        var marker = rawInput.split("youtu.be/")[1];
        if (marker.includes("?")) {
            videoId = marker.split("?")[0];
        } else {
            videoId = marker;
        }
    } else {
        videoId = rawInput; 
    }
    
    if (videoId !== "") {
        // Points the stream container to a stable backup proxy embed frame
        var unblockedIframeUrl = "https://nadeko.net" + videoId;
        canvas.innerHTML = '<iframe src="' + unblockedIframeUrl + '" allowfullscreen></iframe>';
    } else {
        canvas.innerHTML = '<div class="placeholder"><p style="color:#f23f43;">❌ Invalid URL layout.</p></div>';
    }
}
</script>

</body>
</html>
