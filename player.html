            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #212121;

            border-radius: 20px;

            overflow: hidden;
            display: flex;

            border: 1px solid #212121;

            flex: 1;
            background-color: #1f1f1f;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid #212121;
            font-family: monospace;

            flex-grow: 1;

            border-radius: 6px;

<body>

    <!-- 🤖 VAULT ACCESS PLATFORM CONTAINER -->
    <div class="container">
        <h2>🤖 Vault Secured Private Tunnel <span class="status-badge" id="netStatus">LOCKED</span></h2>

            <div class="vault-lock-indicator">🔒 HARDWARE SECURITY VERIFICATION CODES MATCHED</div>

            <button class="client-btn" onclick="initChromebook()">Option B: Mount Chromebook Display</button>

        <div class="main-layout">
            <div class="viewport" id="videoViewport">
                <div class="placeholder-text" id="videoPlaceholder">Access granted. Initialize hardware streaming link layers...</div>

            </div>
            
            <div class="terminal-side">
                <div style="margin-bottom: 8px; font-weight: bold; color: #fff;">🛰️ Guard Node Log:</div>

        </div>
    </div>

<script>
var pubnub = null;
var p2pPipe = null;
var localStream = null;

function appendLog(text) {
    var log = document.getElementById('terminalLog');
    log.innerHTML += "<br>> " + text;
    log.scrollTop = log.scrollHeight;
}

function startNetworkSync() {
    pubnub = new PubNub({
        publishKey: 'pub-c-4b68e916-23cb-4da0-9d0b-78a08d245970',
        subscribeKey: 'sub-c-1349f7e5-1a87-4be7-ba88-971fa08d4bd0',
        userId: 'dev-' + Math.random().toString(36).substring(2, 7)
    });

    pubnub.subscribe({ channels: [MASTER_KEY] });

    pubnub.addListener({
        message: async function(event) {
            var msg = event.message;
            if (msg.type === "offer" && !localStream) {
                appendLog("Chromebook handshaking token found! Synchronizing cryptographic maps...");
                await p2pPipe.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                var answer = await p2pPipe.createAnswer();
                await p2pPipe.setLocalDescription(answer);
                pubnub.publish({ channel: MASTER_KEY, message: { type: "answer", sdp: p2pPipe.localDescription } });
            } else if (msg.type === "answer" && localStream) {
                await p2pPipe.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                appendLog("🔒 SECURE TUNNEL VERIFIED AND ACTIVE!");
                document.getElementById('netStatus').innerText = "ONLINE";
                document.getElementById('netStatus').style.backgroundColor = "#23a55a";
            } else if (msg.type === "ice") {
                p2pPipe.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(e => {});
            }
        }
    });
}

async function initHost() {
    appendLog("Booting hardware video/audio extraction rails...");
    try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        document.getElementById('videoPlaceholder').style.display = 'none';
        var video = document.getElementById('liveScreenStream');
        video.style.display = 'block';
        video.srcObject = localStream;

        p2pPipe = new RTCPeerConnection({ iceServers: [{ urls: "stun:://google.com" }] });
        localStream.getTracks().forEach(track => p2pPipe.addTrack(track, localStream));

        p2pPipe.onicecandidate = e => {
            if (e.candidate) pubnub.publish({ channel: MASTER_KEY, message: { type: "ice", candidate: e.candidate } });
        };

        startNetworkSync();
        appendLog("🟢 BROADCASTER ONLINE. Secured under vault key ID: Digger7756!");
    } catch(e) { appendLog("❌ Error: Broadcast authorization dropped by system."); }
}

function initChromebook() {
    appendLog("Deploying connection receptor array across channel...");
    p2pPipe = new RTCPeerConnection({ iceServers: [{ urls: "stun:://google.com" }] });

    p2pPipe.ontrack = e => {
        appendLog("🟢 P2P Handshake verified! Spinning up secure video layout layer...");
        document.getElementById('videoViewport').style.display = 'none';
        
        var mainContainer = document.getElementById('videoViewport').parentElement;
        document.getElementById('videoViewport').remove();
        
        var viewport = document.createElement('div');
        viewport.className = 'viewport';
        var vid = document.createElement('video');
        vid.autoplay = true; vid.playsInline = true; vid.controls = true;
        vid.style.width = "100%"; vid.style.height = "100%";
        vid.srcObject = e.streams;
        
        viewport.appendChild(vid);
        mainContainer.insertBefore(viewport, mainContainer.firstChild);
    };

    p2pPipe.onicecandidate = e => {
        if (e.candidate) pubnub.publish({ channel: MASTER_KEY, message: { type: "ice", candidate: e.candidate } });
    };

    startNetworkSync();

    p2pPipe.createOffer().then(async offer => {
        await p2pPipe.setLocalDescription(offer);
        pubnub.publish({ channel: MASTER_KEY, message: { type: "offer", sdp: p2pPipe.localDescription } });
    });
}
</script>
