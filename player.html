<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Private P2P Tunnel Frame</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            flex-grow: 1;
        }
        h2 { margin-top: 0; color: #ff0000; font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .setup-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background-color: #1f1f1f;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #212121;
            align-items: center;
        }
        input[type="text"] {
            background-color: #212121;
            border: 1px solid #3c3c3c;
            border-radius: 24px;
            padding: 10px 20px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            width: 250px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }
        button {
            background-color: #cc0000;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #ff0000; }
        button.host-btn { background-color: #23a55a; }
        button.host-btn:hover { background-color: #2bc26b; }
        .main-layout {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: 70vh;
        }
        .viewport {
            flex: 2;
            background-color: #000000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #212121;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }
        .terminal-side {
            flex: 1;
            background-color: #1f1f1f;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid #212121;
            font-family: monospace;
            font-size: 13px;
        }
        .log-feed {
            flex-grow: 1;
            background-color: #0f0f0f;
            border-radius: 6px;
            padding: 10px;
            color: #23a55a;
            overflow-y: auto;
            line-height: 1.5;
        }
        .placeholder-text { color: #888888; text-align: center; font-size: 15px; }
        .status-badge { font-size: 11px; background-color: #444; padding: 2px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
    </style>
    <!-- Stable cloud CDN orchestration script platform link -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div class="container">
    <h2>🤖 Private Multi-Device P2P Screen Tunnel <span class="status-badge" id="netStatus">Standby</span></h2>
    
    <div class="setup-bar">
        <button class="host-btn" onclick="initializeBroadcaster()">Option A: Broadcast Home PC</button>
        <div style="color: #666; font-weight: bold; margin: 0 10px;">OR</div>
        <input type="text" id="connectionCodeInput" placeholder="ENTER ROOM CODE..." maxlength="6">
        <button onclick="connectToRemoteBroadcaster()">Option B: Link Chromebook</button>
    </div>

    <div class="main-layout">
        <div class="viewport" id="videoViewport">
            <div class="placeholder-text" id="videoPlaceholder">Awaiting system initialization parameters...</div>
            <video id="liveScreenStream" autoplay playsinline style="display:none;"></video>
        </div>
        
        <div class="terminal-side">
            <div style="margin-bottom: 8px; font-weight: bold; color: #fff;">🛰️ System Network Log:</div>
            <div class="log-feed" id="terminalLog">> System ready. Choose Option A on your home laptop now...</div>
        </div>
    </div>
</div>

<script>
var localPeerInstance = null;
var localScreenCapture = null;

function appendTerminal(text) {
    var log = document.getElementById('terminalLog');
    log.innerHTML += "<br>> " + text;
    log.scrollTop = log.scrollHeight;
}

// --- OPTION A: BROADCASTER EXECUTION CODE ---
async function initializeBroadcaster() {
    var status = document.getElementById('netStatus');
    appendTerminal("Connecting to unblocked cloud network framework nodes...");
    
    try {
        // Launches the secure peer handler loop first to capture your registration ID
        localPeerInstance = new Peer();
        
        localPeerInstance.on('open', async function(id) {
            // Isolates a clean 6-character room token text sequence
            var cleanRoomCode = id.substring(0, 6).toUpperCase();
            
            appendTerminal("Handshake server active. Initializing monitor media capture data...");
            
            try {
                localScreenCapture = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always", frameRate: 30 },
                    audio: true
                });
                
                document.getElementById('videoPlaceholder').style.display = 'none';
                var video = document.getElementById('liveScreenStream');
                video.style.display = 'block';
                video.srcObject = localScreenCapture;
                
                status.innerText = "Broadcasting";
                status.style.backgroundColor = "#23a55a";
                
                appendTerminal("✨ <strong>BROADCASTER STABLE AND ONLINE.</strong>");
                appendTerminal("🔑 YOUR ROOM CODE IS: <span style='color:#fff; font-size:16px; background-color:#333; padding:2px 6px; border-radius:4px; font-weight:bold;'>" + cleanRoomCode + "</span>");
                appendTerminal("Keep this tab open! Type this code on your school Chromebook to link.");
                
            } catch (mediaErr) {
                appendTerminal("❌ Media Capture Error: Screen permission was rejected or audio check was skipped.");
                localPeerInstance.destroy();
            }
        });
        
        localPeerInstance.on('call', function(incomingTunnelCall) {
            appendTerminal("Chromebook link connection found! Piping raw audio/video matrix stream...");
            incomingTunnelCall.answer(localScreenCapture);
        });
        
        localPeerInstance.on('error', function(err) {
            appendTerminal("❌ Server Error: Connection timed out. Press Option A to recycle tunnels.");
        });
        
    } catch (err) {
        appendTerminal("❌ Initialization Failure: Cloud registry cluster unavailable.");
    }
}

// --- OPTION B: LINK CHROMEBOOK RECEPTOR CODE ---
function connectToRemoteBroadcaster() {
    var targetCode = document.getElementById('connectionCodeInput').value.trim().toUpperCase();
    var status = document.getElementById('netStatus');
    
    if (targetCode === "" || targetCode.length !== 6) {
        appendTerminal("⚠️ Input Error: Please provide a valid 6-digit room code.");
        return;
    }
    
    appendTerminal("Connecting to private peer tunnel room: " + targetCode);
    localPeerInstance = new Peer();
    
    localPeerInstance.on('open', function(id) {
        var dummyStreamContainer = document.createElement('canvas').captureStream(1);
        var activeCallPipe = localPeerInstance.call(targetCode, dummyStreamContainer);
        
        activeCallPipe.on('stream', function(remoteFeedStream) {
            appendTerminal("Secure handshake verified! Rendering layout canvas view...");
            
            var layoutParent = document.getElementById('videoViewport').parentElement;
            document.getElementById('videoViewport').remove();
            
            var cleanViewport = document.createElement('div');
            cleanViewport.className = 'viewport';
            
            var unblockedVideoPlayer = document.createElement('video');
            unblockedVideoPlayer.autoplay = true;
            unblockedVideoPlayer.playsInline = true;
            unblockedVideoPlayer.controls = true;
            unblockedVideoPlayer.style.width = "100%";
            unblockedVideoPlayer.style.height = "100%";
            unblockedVideoPlayer.srcObject = remoteFeedStream;
            
            cleanViewport.appendChild(unblockedVideoPlayer);
            layoutParent.insertBefore(cleanViewport, layoutParent.firstChild);
            
            status.innerText = "Linked";
            status.style.backgroundColor = "#5865f2";
            appendTerminal("🟢 SECURE PEER TUNNEL ACTIVE. System stream running.");
        });
    });
}
</script>

</body>
</html>
