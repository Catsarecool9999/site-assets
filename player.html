<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless P2P Screen Tunnel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            flex-grow: 1;
        }
        h2 { margin-top: 0; color: #ff0000; font-size: 22px; }
        .setup-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background-color: #1f1f1f;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #212121;
        }
        textarea {
            background-color: #212121;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            width: 100%;
            height: 80px;
            margin-bottom: 10px;
            outline: none;
        }
        textarea:focus { border-color: #ff0000; }
        button {
            background-color: #cc0000;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background-color: #ff0000; }
        button.host-btn { background-color: #23a55a; }
        button.host-btn:hover { background-color: #2bc26b; }
        .main-layout {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: 60vh;
        }
        .viewport {
            flex: 2;
            background-color: #000000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #212121;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        .terminal-side {
            flex: 1;
            background-color: #1f1f1f;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid #212121;
            font-family: monospace;
            font-size: 13px;
        }
        .log-feed {
            flex-grow: 1;
            background-color: #0f0f0f;
            border-radius: 6px;
            padding: 10px;
            color: #23a55a;
            overflow-y: auto;
            line-height: 1.4;
        }
        .placeholder-text { color: #888888; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 Serverless Private Video Signal Matrix</h2>
    
    <div class="setup-bar" style="flex-direction: column; gap: 5px;">
        <div style="display:flex; gap:10px; width:100%;">
            <button class="host-btn" onclick="startHost()">Step 1: Broadcast My Laptop</button>
            <button onclick="acceptChromebookAnswer()">Step 4: Lock Connection</button>
            <button onclick="startClient()" style="background-color:#5865f2;">[Chromebook Only] Step 2: Receive Feed</button>
        </div>
        <div style="margin-top: 10px; width:100%;">
            <textarea id="ticketArea" placeholder="Your connection session tickets will generate here..."></textarea>
        </div>
    </div>

    <div class="main-layout">
        <div class="viewport" id="videoViewport">
            <div class="placeholder-text" id="videoPlaceholder">Awaiting cryptographic handshake loops...</div>
            <video id="liveScreenStream" autoplay playsinline style="display:none;"></video>
        </div>
        
        <div class="terminal-side">
            <div style="margin-bottom: 8px; font-weight: bold; color: #fff;">🛰️ Local Engine Log:</div>
            <div class="log-feed" id="terminalLog">> Engine ready. Click Step 1 to broadcast your laptop screen natively.</div>
        </div>
    </div>
</div>

<script>
var p2pPipe = null;
var localStream = null;
var networkChannel = null;

function printLog(text) {
    var log = document.getElementById('terminalLog');
    log.innerHTML += "<br>> " + text;
    log.scrollTop = log.scrollHeight;
}

// Configuration options mapping offline fallback routing arrays
var rtcConfig = { iceServers: [{ urls: "stun:://google.com" }] };

// --- STEP 1: RUN THIS AT HOME ON YOUR LAPTOP ---
async function startHost() {
    printLog("Requesting native screen media frame objects...");
    try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        document.getElementById('videoPlaceholder').style.display = 'none';
        var video = document.getElementById('liveScreenStream');
        video.style.display = 'block';
        video.srcObject = localStream;

        p2pPipe = new RTCPeerConnection(rtcConfig);
        networkChannel = p2pPipe.createDataChannel("chat");

        localStream.getTracks().forEach(track => p2pPipe.addTrack(track, localStream));

        p2pPipe.onicecandidate = e => {
            if (!e.candidate) {
                document.getElementById('ticketArea').value = btoa(JSON.stringify(p2pPipe.localDescription));
                printLog("✨ SUCCESS! Copy the long text block from the box above. Text it to yourself or save it in Discord. You will need to paste this into your Chromebook tomorrow!");
            }
        };

        var offer = await p2pPipe.createOffer();
        await p2pPipe.setLocalDescription(offer);
    } catch (err) {
        printLog("❌ Error: Permission denied or browser blocked framing.");
    }
}

// --- STEP 2 & 3: RUN THIS AT SCHOOL ON YOUR CHROMEBOOK ---
async function startClient() {
    var rawTicket = document.getElementById('ticketArea').value.trim();
    if (rawTicket === "") {
        printLog("⚠️ Error: Paste the laptop's ticket block into the textarea box first!");
        return;
    }

    printLog("Parsing cryptographic laptop ticket data...");
    p2pPipe = new RTCPeerConnection(rtcConfig);

    p2pPipe.ontrack = e => {
        printLog("🟢 Stream verified! Syncing frame layout viewport...");
        document.getElementById('videoPlaceholder').style.display = 'none';
        var video = document.getElementById('liveScreenStream');
        video.style.display = 'block';
        video.srcObject = e.streams[0];
    };

    p2pPipe.onicecandidate = e => {
        if (!e.candidate) {
            document.getElementById('ticketArea').value = btoa(JSON.stringify(p2pPipe.localDescription));
            printLog("📋 Chromebook response ticket ready! Copy the text above, send it back to your laptop browser window, paste it there, and hit Step 4.");
        }
    };

    var parsedOffer = new RTCSessionDescription(JSON.parse(atob(rawTicket)));
    await p2pPipe.setRemoteDescription(parsedOffer);
    var answer = await p2pPipe.createAnswer();
    await p2pPipe.setLocalDescription(answer);
}

// --- STEP 4: RUN THIS BACK ON YOUR LAPTOP AT HOME TO LOCK IT ---
async function acceptChromebookAnswer() {
    var rawAnswer = document.getElementById('ticketArea').value.trim();
    if (rawAnswer === "") {
        printLog("⚠️ Error: Paste the Chromebook's response text block here!");
        return;
    }
    var parsedAnswer = new RTCSessionDescription(JSON.parse(atob(rawAnswer)));
    await p2pPipe.setRemoteDescription(parsedAnswer);
    printLog("🔒 Handshake locked! Encrypted video pipeline active.");
}
</script>

</body>
</html>
